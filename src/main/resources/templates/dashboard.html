<!DOCTYPE html>
<html>
<head>
    <title>Fraud Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background: #333;
            color: white;
        }
        .fraud {
            background-color: #ffcccc;
        }
    </style>
</head>
<body>

<h1>💳 Fraud Detection Dashboard</h1>

<table id="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Amount</th>
            <th>Location</th>
            <th>Time</th>
            <th>Risk</th>
            <th>Fraud</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
fetch('/api/all')
.then(res => res.json())
.then(data => {
    let table = document.querySelector("tbody");

    data.forEach(t => {
        let row = `<tr class="${t.fraud ? 'fraud' : ''}">
            <td>${t.id}</td>
            <td>${t.amount}</td>
            <td>${t.location}</td>
            <td>${t.time}</td>
            <td>${t.riskScore}</td>
            <td>${t.fraud}</td>
        </tr>`;
        table.innerHTML += row;
    });
});
</script>

</body>
</html>
